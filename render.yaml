databases:
  - name: russian-learning-db
    plan: free
    databaseName: russian_learning
    user: russian_learning

services:
  - type: web
    name: russian-learning
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: russian-learning-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
